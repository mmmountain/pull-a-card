function earthTex() {
  const w = 1024, h = 512, c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); const img = g.createImageData(w, h);
  const hash = (x, y) => { const s1 = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s1 - Math.floor(s1); };
  const noise = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    const px = Math.cos(lat) * Math.cos(lon) * 2.2 + 5, py = Math.sin(lat) * 2.2 + 5, pz = Math.cos(lat) * Math.sin(lon) * 2.2;
    const n = fbm(px + pz * 0.7, py - pz * 0.4); const i = (y * w + x) * 4;

  fish() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), gloss(0xffe11a)); body.scale.set(1.1, 0.95, 0.28); g.add(body);
    const stripe = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32, 0, Math.PI * 2, 0, Math.PI), gloss(0x111111)); stripe.scale.set(0.22, 0.97, 0.3); stripe.position.x = 0.45; g.add(stripe);
    const white = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), gloss(0xf6f9ff)); white.scale.set(0.55, 0.85, 0.3); white.position.x = -0.15; g.add(white);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.7, 3), gloss(0xffd400)); tail.rotation.z = Math.PI / 2; tail.position.x = -1.25; tail.scale.z = 0.2; g.add(tail);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 8), gloss(0x111111)); eye.position.set(0.85, 0.2, 0.22); g.add(eye);
    g.rotation.set(0.1, -0.4, 0.15); return g;
  },
  bubble() {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), glassMat({ thickness: 0.05, iridescence: 1, iridescenceIOR: 1.3, roughness: 0.0 }));
    return m;
  },
};

function scene() { const sc = new THREE.Scene(); lights(sc); return sc; }
function catcher(x, z, size) { const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShadowMaterial({ opacity: 0.2 })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.14, z); m.receiveShadow = true; return m; }

window.renderLayer = (name, level = 0) => {
  const sc = scene();
  if (name === "bg") { sc.background = null; sc.add(new THREE.Mesh(new THREE.SphereGeometry(900, 64, 32), skyMaterial())); sc.add(world); }
  else {
    const obj = NEEDS[name](level); obj.traverse((o) => { if (o.isMesh) o.castShadow = true; }); sc.add(obj);
    if (name === "water") sc.add(catcher(-0.95, 5.6, 5));
    if (name === "bathroom") sc.add(catcher(1.7, 2.6, 6));
  }
  renderer.setClearColor(0x000000, 0);
  renderer.render(sc, camera);
  return renderer.domElement.toDataURL("image/png");
};
// sprites render on their own small canvas, centered
const small = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
small.setSize(512, 512); small.outputColorSpace = THREE.SRGBColorSpace; small.toneMapping = THREE.ACESFilmicToneMapping;
window.renderSprite = (name) => {
  const sc = new THREE.Scene(); sc.environment = pmrem.fromScene(skyScene, 0).texture;
  sc.add(new THREE.DirectionalLight(0xffffff, 2.5).translateX(-3).translateY(5).translateZ(4), new THREE.HemisphereLight(0xdff4ff, 0x9fd36a, 1));
  sc.add(SPRITES[name]());
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0.3, 6); cam.lookAt(0, 0, 0);
  small.setClearColor(0, 0); small.render(sc, cam); return small.domElement.toDataURL("image/png");
};
window.ready = true;
</script>
