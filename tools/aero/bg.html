<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
// Frutiger Aero layers for Prompt's focus scene, drawn on canvas: landscape, glass orb back/front, liquids.
const R = (a, b) => a + Math.random() * (b - a);
function cv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
let seed = 7; Math.random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

window.landscape = () => {
  const W = 1080, H = 1920; const [c, g] = cv(W, H);
  // sky
  let gr = g.createLinearGradient(0, 0, 0, H * 0.7);
  gr.addColorStop(0, "#0b86e0"); gr.addColorStop(0.45, "#4cbcff"); gr.addColorStop(1, "#dff5ff");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // aurora ribbons, faint
  g.globalCompositeOperation = "screen";
  for (const [y, col] of [[260, "rgba(120,255,214,0.20)"], [420, "rgba(150,220,255,0.18)"]]) {
    g.filter = "blur(40px)"; g.strokeStyle = col; g.lineWidth = 120; g.beginPath(); g.moveTo(-100, y);
    g.bezierCurveTo(W * 0.3, y - 160, W * 0.6, y + 140, W + 100, y - 60); g.stroke();
  }
  g.filter = "none"; g.globalCompositeOperation = "source-over";
  // sun + lens flare
  const sx = W * 0.8, sy = H * 0.13;
  gr = g.createRadialGradient(sx, sy, 0, sx, sy, 520);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.08, "rgba(255,255,245,0.95)"); gr.addColorStop(0.25, "rgba(255,250,210,0.35)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "screen";
  for (let i = 0; i < 14; i++) { g.save(); g.translate(sx, sy); g.rotate(i * Math.PI / 7 + 0.2); g.filter = "blur(6px)";
    g.fillStyle = "rgba(255,255,255,0.10)"; g.beginPath(); g.moveTo(0, 0); g.lineTo(900, -22); g.lineTo(900, 22); g.fill(); g.restore(); }
  g.filter = "none";
  [[0.35, 60, "rgba(160,255,230,0.22)"], [0.55, 26, "rgba(255,255,255,0.35)"], [0.75, 90, "rgba(130,200,255,0.18)"], [0.95, 40, "rgba(200,255,170,0.25)"]].forEach(([t, r, col]) => {
    const x = sx + (W * 0.35 - sx) * t * 1.4, y = sy + (H * 0.55 - sy) * t;
    gr = g.createRadialGradient(x, y, r * 0.2, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r * 0.95, 0, 7); g.stroke();
  });
  g.globalCompositeOperation = "source-over";
  // clouds
  const cloud = (cx, cy, s) => {
    g.save(); g.filter = "blur(2px)";
    for (let i = 0; i < 16; i++) { const x = cx + R(-1.4, 1.4) * s, y = cy + R(-0.35, 0.25) * s, r = R(0.35, 0.7) * s * (1 - Math.abs(x - cx) / (2.2 * s));
      gr = g.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r); gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.7, "#f4fbff"); gr.addColorStop(1, "rgba(214,236,252,0.9)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, Math.max(8, r), 0, 7); g.fill(); }
    g.restore();
  };
  cloud(220, 520, 110); cloud(760, 640, 140); cloud(470, 330, 70); cloud(980, 420, 80);
  // hills: back to front, glossy tops
  const hill = (base, amp, cols, hiA, ph) => {
    const pts = []; for (let x = -40; x <= W + 40; x += 20) pts.push([x, base - Math.sin(x / W * Math.PI * 1.3 + ph) * amp - Math.sin(x / W * 7 + ph * 2) * amp * 0.12]);
    g.beginPath(); g.moveTo(-40, H); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W + 40, H); g.closePath();
    gr = g.createLinearGradient(0, base - amp, 0, H); cols.forEach((c, i) => gr.addColorStop(i / (cols.length - 1), c)); g.fillStyle = gr; g.fill();
    g.save(); g.clip(); g.filter = "blur(10px)"; g.strokeStyle = `rgba(255,255,230,${hiA})`; g.lineWidth = 34; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y + 18) : g.moveTo(x, y + 18)); g.stroke(); g.restore();
    return pts;
  };
  hill(H * 0.66, 70, ["#9be07a", "#4fae3a", "#2f8d2c"], 0.35, 0.4);
  hill(H * 0.74, 90, ["#b8f04a", "#6cc32a", "#3b9a23"], 0.5, 2.1);
  const front = hill(H * 0.84, 70, ["#c9f763", "#7fd12f", "#3f9f22", "#2d7f1b"], 0.6, 4.0);
  // grass blades on the front hill
  g.save(); g.beginPath(); g.moveTo(-40, H); front.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W + 40, H); g.closePath(); g.clip();
  for (let i = 0; i < 2600; i++) { const x = R(0, W), y = R(H * 0.76, H), h = R(14, 46) * (0.6 + (y - H * 0.76) / (H * 0.24)), lean = R(-8, 8);
    g.strokeStyle = Math.random() < 0.5 ? `rgba(220,255,140,${R(0.15, 0.45)})` : `rgba(40,110,20,${R(0.1, 0.35)})`; g.lineWidth = R(1.5, 3.5);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.3, y - h * 0.6, x + lean, y - h); g.stroke(); }
  g.restore();
  // bokeh + bubbles
  for (let i = 0; i < 40; i++) { const x = R(0, W), y = R(0, H * 0.9), r = R(10, 60);
    gr = g.createRadialGradient(x, y, r * 0.5, x, y, r); gr.addColorStop(0, `rgba(255,255,255,${R(0.04, 0.16)})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  for (let i = 0; i < 18; i++) { const x = R(0, W), y = R(H * 0.2, H * 0.95), r = R(8, 34);
    gr = g.createRadialGradient(x, y, r * 0.6, x, y, r); gr.addColorStop(0, "rgba(255,255,255,0.03)"); gr.addColorStop(0.85, "rgba(255,255,255,0.10)"); gr.addColorStop(1, "rgba(255,255,255,0.55)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = "rgba(255,255,255,0.8)"; g.beginPath(); g.ellipse(x - r * 0.35, y - r * 0.4, r * 0.22, r * 0.12, -0.6, 0, 7); g.fill(); }
  return c.toDataURL("image/jpeg", 0.9);
};

window.orbBack = () => {
  const S = 512, [c, g] = cv(S, S), r = S / 2 - 6, m = S / 2;
  let gr = g.createRadialGradient(m, m * 1.1, r * 0.2, m, m, r);
  gr.addColorStop(0, "rgba(255,255,255,0.10)"); gr.addColorStop(0.75, "rgba(170,225,255,0.22)"); gr.addColorStop(1, "rgba(20,90,160,0.45)");
  g.fillStyle = gr; g.beginPath(); g.arc(m, m, r, 0, 7); g.fill();
  return c.toDataURL("image/png");
};
window.orbFront = () => {
  const S = 512, [c, g] = cv(S, S), r = S / 2 - 6, m = S / 2;
  g.save(); g.beginPath(); g.arc(m, m, r, 0, 7); g.clip();
  // rim shading
  let gr = g.createRadialGradient(m, m, r * 0.78, m, m, r);
  gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(10,70,130,0.35)"); g.fillStyle = gr; g.fillRect(0, 0, S, S);
  // big top highlight
  gr = g.createLinearGradient(0, m - r, 0, m - r * 0.05);
  gr.addColorStop(0, "rgba(255,255,255,0.92)"); gr.addColorStop(0.55, "rgba(255,255,255,0.35)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.beginPath(); g.ellipse(m, m - r * 0.42, r * 0.74, r * 0.5, 0, 0, 7); g.fill();
  // bottom bounce light
  gr = g.createRadialGradient(m, m + r * 1.05, r * 0.3, m, m + r * 1.05, r * 0.85);
  gr.addColorStop(0, "rgba(220,255,250,0.0)"); gr.addColorStop(0.75, "rgba(220,255,250,0.55)"); gr.addColorStop(1, "rgba(220,255,250,0)");
  g.fillStyle = gr; g.fillRect(0, m, S, m);
  g.restore();
  // crisp rim + specular
  g.strokeStyle = "rgba(255,255,255,0.75)"; g.lineWidth = 4; g.beginPath(); g.arc(m, m, r - 2, 0, 7); g.stroke();
  g.strokeStyle = "rgba(0,80,150,0.25)"; g.lineWidth = 2; g.beginPath(); g.arc(m, m, r + 1, 0, 7); g.stroke();
  g.fillStyle = "rgba(255,255,255,0.95)"; g.beginPath(); g.ellipse(m - r * 0.45, m - r * 0.5, r * 0.09, r * 0.05, -0.7, 0, 7); g.fill();
  return c.toDataURL("image/png");
};
window.liquid = (hex) => {
  const W = 640, H = 900, [c, g] = cv(W, H);
  const col = (a) => hex + Math.round(a * 255).toString(16).padStart(2, "0");
  const wave = (y, amp, k, ph) => { g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, y + Math.sin(x / W * Math.PI * k + ph) * amp); g.lineTo(W, H); g.closePath(); };
  // body
  wave(40, 14, 4, 0.3);
  let gr = g.createLinearGradient(0, 30, 0, H); gr.addColorStop(0, col(0.75)); gr.addColorStop(0.35, col(0.85)); gr.addColorStop(1, col(0.98));
  g.fillStyle = gr; g.fill();
  // second, lighter wave for depth
  g.save(); wave(40, 14, 4, 0.3); g.clip();
  wave(62, 10, 5, 2.0); g.fillStyle = "rgba(255,255,255,0.12)"; g.fill();
  // glossy surface line
  g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 5; g.beginPath(); for (let x = 0; x <= W; x += 8) { const y = 40 + Math.sin(x / W * Math.PI * 4 + 0.3) * 14; x ? g.lineTo(x, y + 3) : g.moveTo(x, y + 3); } g.stroke();
  // caustic glints
  for (let i = 0; i < 26; i++) { const x = R(0, W), y = R(90, H); g.fillStyle = `rgba(255,255,255,${R(0.05, 0.16)})`; g.beginPath(); g.ellipse(x, y, R(10, 40), R(3, 8), R(-0.4, 0.4), 0, 7); g.fill(); }
  // bubbles
  for (let i = 0; i < 30; i++) { const x = R(0, W), y = R(90, H), r = R(3, 12);
    g.strokeStyle = "rgba(255,255,255,0.6)"; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
    g.fillStyle = "rgba(255,255,255,0.7)"; g.beginPath(); g.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, 7); g.fill(); }
  g.restore();
  return c.toDataURL("image/png");
};
window.ready = true;
</script></body></html>
